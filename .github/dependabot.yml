version: 2

updates:
  # ── npm packages (Docusaurus site, managed with yarn 1) ────────────────────
  # The ecosystem is called "npm" for yarn projects too. Dependabot detects
  # yarn.lock and updates it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    # Group minor and patch version updates into a single PR to reduce noise.
    # Security updates are not affected by this group and still get their own PR.
    groups:
      dependencies:
        update-types:
          - "minor"
          - "patch"
    # Major versions need a manual migration and a test build of both locales:
    # - @docusaurus/*: major releases change config, theme components and the
    #   swizzled Footer and NotFound in src/theme/
    # - @easyops-cn/docusaurus-search-local: follows the Docusaurus major
    # - react, react-dom, @types/react: must match what Docusaurus supports
    # - typescript: pinned with ~, major compiler changes need a typecheck pass
    ignore:
      - dependency-name: "@docusaurus/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@easyops-cn/docusaurus-search-local"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
